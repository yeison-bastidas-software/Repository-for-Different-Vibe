{% extends "layout.html" %}

{% block title %}Choose Mode{% endblock %}

{% block main %}
<div class="row justify-content-center mt-5">
    <div class="col-md-10">
        <h2 class="text-center brand-text mb-5">Select Effect Mode</h2>

        <div class="row">
            <div class="col-md-6 mb-4">
                <a href="/edit?mode=slow" class="text-decoration-none">
                    <div class="card h-100 border-0 shadow-lg hover-card slow-card">
                        <div class="card-body text-center py-5">
                            <h1 class="display-1 slow-text mb-3">SLOW</h1>
                            <p class="text-muted">Deep, atmospheric, chilled</p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6 mb-4">
                <a href="/edit?mode=speed" class="text-decoration-none">
                    <div class="card h-100 border-0 shadow-lg hover-card speed-card">
                        <div class="card-body text-center py-5">
                            <h1 class="display-1 speed-text mb-3">SPEED</h1>
                            <p class="text-muted">Fast, energetic, hype</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
