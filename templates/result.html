{% extends "layout.html" %}

{% block title %}Result{% endblock %}

{% block main %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 text-center">
        <h2 class="text-danger mb-4">Your Edit is Ready!</h2>

        <audio controls class="w-100 mb-4">
            <source src="{{ url_for('static', filename='processed/' + filename) }}" type="audio/mpeg">
        </audio>

        <div class="d-grid gap-2 d-md-flex justify-content-md-center">
            <a href="{{ url_for('static', filename='processed/' + filename) }}" download class="btn btn-success btn-lg px-5">
                Download MP3
            </a>
            <a href="/" class="btn btn-outline-secondary btn-lg px-5">Start Over</a>
        </div>
    </div>
</div>
{% endblock %}
