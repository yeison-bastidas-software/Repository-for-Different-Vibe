{% extends "layout.html" %}

{% block title %}Edit{% endblock %}

{% block main %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8">
        <h2 class="text-center text-danger mb-4">
            {% if mode == 'slow' %}SLOW MODE{% else %}SPEED MODE{% endif %}
        </h2>

        <div class="card border-0 shadow p-4 mb-4">
            <label class="form-label text-secondary mb-3">
                Intensity: <span id="intensity-val" class="text-danger fw-bold">0</span>%
            </label>

            <input type="range" class="form-range" id="intensity" min="0" max="100" value="0">

            <input type="hidden" id="mode-value" value="{{ mode }}">
            <input type="hidden" id="file-size" value="{{ file_size_mb }}">

            <div class="text-center mt-4">
                <button onclick="processAudio()" class="btn btn-lg px-5 {% if mode == 'slow' %}btn-slow{% else %}btn-speed{% endif %}">
                    Process Audio
                </button>
            </div>
        </div>

        <div id="progress-container" class="d-none">
            <div class="progress" style="height: 30px;">
                <div id="progress-bar" class="progress-bar {% if mode == 'slow' %}bg-slow{% else %}bg-speed{% endif %}" role="progressbar" style="width: 0%"></div>
            </div>
            <p class="text-center text-secondary mt-2">Processing... <span id="progress-text">0%</span></p>
        </div>
    </div>
</div>
{% endblock %}
