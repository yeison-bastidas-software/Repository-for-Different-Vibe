{% extends "layout.html" %}

{% block title %}Edit{% endblock %}

{% block main %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8">
        <h2 class="text-center brand-text mb-4">
            {% if mode == 'slow' %}SLOW MODE{% else %}SPEED MODE{% endif %}
        </h2>

        <div class="card border-0 shadow p-4 mb-4">
            <label class="form-label text-muted mb-3">
                Intensity: <span id="intensity-val" class="brand-text fw-bold">0</span>%
            </label>

            <input type="range" class="form-range" id="intensity" min="0" max="100" value="0">

            <input type="hidden" id="mode-value" value="{{ mode }}">
            <input type="hidden" id="file-size" value="{{ file_size_mb }}">

            <div class="text-center mt-4">
                <button id="process-btn" onclick="processAudio()" class="btn btn-lg px-5 {% if mode == 'slow' %}btn-slow{% else %}btn-speed{% endif %}">
                    Process Audio
                </button>
            </div>
        </div>

        <div id="progress-container" class="d-none">
            <div class="progress" style="height: 30px;">
                <div id="progress-bar" class="progress-bar {% if mode == 'slow' %}bg-slow{% else %}bg-speed{% endif %}" role="progressbar" style="width: 0%"></div>
            </div>
            <p class="text-center text-muted mt-2">Processing... <span id="progress-text">0%</span></p>
        </div>
    </div>
</div>

<script>
// Progress bar synced with real server completion
document.addEventListener('DOMContentLoaded', () => {
    const processBtn = document.querySelector('.process-btn') || document.querySelector('button[onclick]');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const intensityInput = document.getElementById('intensity');
    const modeInput = document.getElementById('mode-value');
    const mode = modeInput ? modeInput.value : new URLSearchParams(location.search).get('mode');

    if (!processBtn) return;
    processBtn.removeAttribute('onclick');

    processBtn.addEventListener('click', async () => {
        processBtn.disabled = true;
        if (progressContainer) progressContainer.classList.remove('d-none');

        // Simulated crawl, caps at 90%
        let progress = 0;
        const sim = setInterval(() => {
            progress += Math.max(0.4, (90 - progress) * 0.03);
            if (progress > 90) progress = 90;
            if (progressBar) progressBar.style.width = progress + '%';
            if (progressText) progressText.textContent = Math.floor(progress) + '%';
        }, 100);

        const qs = `mode=${mode}&intensity=${intensityInput.value}`;
        try {
            // Send params in query AND body; try POST first, fall back to GET
            let res = await fetch(`/process?${qs}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: qs
            });
            if (res.status === 405) {
                res = await fetch(`/process?${qs}`);
            }

            clearInterval(sim);
            if (progressBar) progressBar.style.width = '100%';
            if (progressText) progressText.textContent = '100%';

            // Go wherever the server ended up (result page on success)
            setTimeout(() => { window.location.href = res.url; }, 400);
        } catch (e) {
            clearInterval(sim);
            processBtn.disabled = false;
            if (progressText) progressText.textContent = 'Error, try again';
        }
    });
});
</script>
{% endblock %}
